Create the following variables:
studentName – store the student's name.
age – store the student's age.
course – store the course name.
mark1 – store the mark of the first subject.

mark3 – store the mark of the third subject.

<body>

    <script>
        let studentName = "sachin";
        let age = 23;
        let course = "Computer Science";
    
        console.log(`My name is ${studentName} and i am ${age} years old`);   

        let firstsubjectmark1 = 85;
        let secondsubjectmark2 = 90;
        let thirdsubjectmark3 = 95;
