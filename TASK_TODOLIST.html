
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 40px 15px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #263547;
        }

        form {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #addBtn {
            background: #2563eb;
            color: white;
        }

        #addBtn:hover {
            background: #1d4ed8;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        li {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }

        .task-text {
            flex: 1;
            overflow-wrap: anywhere;
            cursor: pointer;
        }

        li.completed .task-text {
            text-decoration: line-through;
            color: #888;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        #emptyMessage {
            text-align: center;
            color: #777;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>My To-Do List</h1>

        <form id="taskForm">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task"
                aria-label="Enter a task"
            >
            <button type="submit" id="addBtn">Add Task</button>
        </form>

        <ul id="taskList"></ul>
        <p id="emptyMessage">No tasks yet. Add your first task!</p>
    </div>

    <script>
        const taskForm = document.getElementById("taskForm");
        const taskInput = document.getElementById("taskInput");
        const taskList = document.getElementById("taskList");
        const emptyMessage = document.getElementById("emptyMessage");


        // Retrieve saved tasks from localStorage into an array
        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

        // Save tasks to localStorage
        function saveTasks() {
            localStorage.setItem("tasks", JSON.stringify(tasks));
        }

        // Display tasks on the page
        function renderTasks() {
            taskList.innerHTML = "";

            tasks.forEach((task, index) => {
                const li = document.createElement("li");
                li.dataset.index = index;

                if (task.completed) {
                    li.classList.add("completed");
                }

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.className = "task-checkbox";
                checkbox.checked = task.completed;
                checkbox.setAttribute(
                    "aria-label",
                    "Mark " + task.text + " as completed"
                );

                const span = document.createElement("span");
                span.className = "task-text";
                span.textContent = task.text;

                const deleteBtn = document.createElement("button");
                deleteBtn.textContent = "Delete";
                deleteBtn.className = "delete-btn";
                deleteBtn.type = "button";

                li.appendChild(checkbox);
                li.appendChild(span);
                li.appendChild(deleteBtn);

                taskList.appendChild(li);
            });

            emptyMessage.style.display =
                tasks.length === 0 ? "block" : "none";
        }

        // Handle form submission and validation
        taskForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const taskText = taskInput.value.trim();

            if (taskText === "") {
                alert("Please enter a task!");
                taskInput.focus();
                return;
            }

            tasks.push({
                text: taskText,
                completed: false
            });

            saveTasks();
            renderTasks();

            taskInput.value = "";
            taskInput.focus();
        });

        // Event delegation: one listener for all task interactions
        taskList.addEventListener("click", function(event) {
            const li = event.target.closest("li");

            if (!li || !taskList.contains(li)) {
                return;
            }

            const index = Number(li.dataset.index);

            // Delete a task
            if (event.target.closest(".delete-btn")) {
                tasks.splice(index, 1);
                saveTasks();
                renderTasks();
                return;
            }

            // Toggle completion when task text is clicked
            if (event.target.classList.contains("task-text")) {
                tasks[index].completed = !tasks[index].completed;
                saveTasks();
                renderTasks();
            }
        });

        // Handle checkbox changes using event delegation
        taskList.addEventListener("change", function(event) {
            if (!event.target.classList.contains("task-checkbox")) {
                return;
            }

            const li = event.target.closest("li");
            const index = Number(li.dataset.index);

            tasks[index].completed = event.target.checked;

            saveTasks();
            renderTasks();
        });

        // Display previously saved tasks on page load
        renderTasks();
    </script>
</body>
</html>
